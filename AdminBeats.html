<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jaddy Studio Pro - Marketplace & Editor Master</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #030303;
            color: #e0e0e0;
            overflow-x: hidden;
        }
        .animate-spin-slow { animation: spin 10s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        input, textarea, select {
            background: rgba(255, 255, 255, 0.03) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            border-radius: 12px !important;
            padding: 12px !important;
            outline: none !important;
            color: white;
            width: 100%;
        }
        input:focus, select:focus, textarea:focus { border-color: #ea580c !important; }
        
        .switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 20px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #333;
            transition: .4s;
            border-radius: 20px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 14px; width: 14px;
            left: 3px; bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: #ea580c; }
        input:checked + .slider:before { transform: translateX(20px); }
    </style>
</head>
<body>

    <div id="app">
        <nav class="p-4 border-b border-white/5 bg-black/80 backdrop-blur-2xl sticky top-0 z-[60]">
            <div class="max-w-5xl mx-auto flex justify-between items-center">
                <div class="flex items-center gap-6">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-gradient-to-br from-orange-500 to-red-700 rounded-xl flex items-center justify-center shadow-lg">
                            <i data-lucide="disc" class="text-black animate-spin-slow w-6 h-6"></i>
                        </div>
                        <div>
                            <h1 class="text-lg font-black italic tracking-tighter leading-none text-white uppercase text-orange-500">Jaddy Studio</h1>
                            <p class="text-[7px] font-bold text-white uppercase tracking-[0.2em] mt-1">Admin Panel</p>
                        </div>
                    </div>
                </div>
                
                <div class="flex items-center gap-2">
                    <a href="artistas.html" class="flex items-center gap-2 px-3 py-2 bg-white/5 hover:bg-white/10 text-white rounded-lg font-black text-[9px] uppercase tracking-widest transition-all">
                        <i data-lucide="users" class="w-3.5 h-3.5"></i> ARTISTAS
                    </a>
                    <a href="portal_vip.html" class="flex items-center gap-2 px-3 py-2 bg-orange-500/10 hover:bg-orange-500/20 text-orange-500 rounded-lg font-black text-[9px] uppercase tracking-widest transition-all border border-orange-500/10">
                        <i data-lucide="star" class="w-3.5 h-3.5"></i> PORTAL VIP
                    </a>
                    <button onclick="window.prepareCreate()" class="flex items-center gap-2 px-4 py-2 bg-orange-600 text-white rounded-lg font-black text-[9px] uppercase tracking-widest shadow-lg active:scale-95 transition-all">
                        <i data-lucide="plus" class="w-3.5 h-3.5"></i> AGREGAR BEAT
                    </button>
                </div>
            </div>
        </nav>

        <main class="max-w-5xl mx-auto p-4 pt-8 pb-40">
            <section id="beatForm" class="hidden bg-[#0a0a0a] border border-white/5 p-6 rounded-3xl shadow-2xl mb-8">
                <div class="flex justify-between items-center mb-6 border-b border-white/5 pb-3">
                    <h2 id="formTitle" class="text-sm font-black uppercase italic tracking-tighter text-white flex items-center gap-2">
                        <i data-lucide="settings" class="text-orange-500 w-4 h-4"></i> Configurar Pista
                    </h2>
                    <button onclick="window.toggleForm()" class="text-neutral-500 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
                </div>
                
                <form id="uploadForm" class="space-y-6">
                    <input type="hidden" id="editingId">
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        <div class="space-y-4">
                            <label class="text-[9px] font-bold text-orange-500 uppercase px-1">Información Básica</label>
                            <input type="text" id="title" placeholder="Título del Beat" required>
                            <input type="text" id="producer" placeholder="Productor (Jaddy Studio)">
                            <select id="category">
                                <option value="licencia">Venta por Licencia</option>
                                <option value="exclusiva">Venta Exclusiva</option>
                            </select>
                            <select id="targetPortal" onchange="window.togglePortalFields()">
                                <option value="marketplace">Marketplace Público</option>
                                <option value="vip">Portal VIP</option>
                            </select>
                            <div id="artistContainer" class="hidden">
                                <select id="assignedTo">
                                    <option value="">Cargando artistas...</option>
                                </select>
                            </div>
                            <div class="flex items-center justify-between p-3 bg-white/5 rounded-xl border border-white/5">
                                <span class="text-[10px] font-bold uppercase text-neutral-400">Pista Visible</span>
                                <label class="switch">
                                    <input type="checkbox" id="isVisible" checked>
                                    <span class="slider"></span>
                                </label>
                            </div>
                        </div>

                        <div class="space-y-4">
                            <label class="text-[9px] font-bold text-orange-500 uppercase px-1">Media & Enlaces (GitHub Raw)</label>
                            <input type="text" id="url" placeholder="Ej: https://raw.githubusercontent.com/.../pista.mp3" required>
                            <input type="text" id="genre" placeholder="Género (Trap, Reggaeton...)">
                            <input type="text" id="whatsapp" placeholder="WhatsApp (Ej: 1829...)" required>
                            <textarea id="description" placeholder="Descripción de la pista" rows="2" class="text-sm"></textarea>
                        </div>

                        <div class="space-y-4">
                            <label class="text-[9px] font-bold text-orange-500 uppercase px-1">Precios y Crédito</label>
                            <select id="saleType" onchange="window.toggleCreditFields()">
                                <option value="contado">Solo Contado</option>
                                <option value="credito">Solo Crédito</option>
                                <option value="ambos">Ambos (Contado y Crédito)</option>
                            </select>
                            <input type="number" id="price" step="0.01" placeholder="Precio Total ($)" required>
                            
                            <div id="creditConfig" class="space-y-3 bg-orange-600/5 p-4 rounded-2xl border border-orange-500/10">
                                <label class="text-[9px] font-bold text-orange-500 uppercase">Ajustes de Crédito</label>
                                <div class="grid grid-cols-2 gap-2">
                                    <input type="number" id="downPayment" placeholder="Inicial $">
                                    <input type="number" id="installmentsCount" placeholder="N° Cuotas">
                                </div>
                                <input type="number" id="paymentDays" placeholder="Frecuencia (Ej: 7 días)">
                            </div>
                        </div>
                    </div>

                    <button type="submit" id="submitBtn" class="w-full bg-orange-600 py-4 rounded-xl font-black uppercase tracking-widest text-[10px] flex items-center justify-center gap-2 hover:bg-orange-500 transition-all shadow-lg shadow-orange-900/20">
                        <i data-lucide="zap" class="w-4 h-4"></i> <span id="submitBtnText">GUARDAR CAMBIOS</span>
                    </button>
                </form>
            </section>

            <!-- Pestañas de Selección de Catálogo -->
            <div class="flex items-center justify-between mb-6 border-b border-white/5 pb-4">
                <div class="flex gap-3">
                    <button onclick="window.switchTab('marketplace')" id="tabMarketplace" class="flex items-center gap-2 px-4 py-2.5 rounded-xl font-black text-xs uppercase tracking-wider transition-all bg-orange-600 text-white shadow-lg shadow-orange-900/20">
                        <i data-lucide="music" class="w-4 h-4"></i> Marketplace Público (<span id="counterMarketplace">0</span>)
                    </button>
                    <button onclick="window.switchTab('vip')" id="tabVip" class="flex items-center gap-2 px-4 py-2.5 rounded-xl font-black text-xs uppercase tracking-wider transition-all bg-white/5 text-neutral-400 hover:text-white border border-white/5">
                        <i data-lucide="star" class="w-4 h-4"></i> Portal VIP (<span id="counterVip">0</span>)
                    </button>
                </div>
            </div>
            
            <!-- Contenedor Dinámico de la Pestaña Activa -->
            <div id="activeTabContainer" class="flex flex-col gap-3"></div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
        import { getFirestore, collection, addDoc, updateDoc, onSnapshot, doc, deleteDoc, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDIaAvpJZrJjQUKsh6KGD7gALJNskto8A8",
            authDomain: "jaddy-estudio.firebaseapp.com",
            projectId: "jaddy-estudio",
            storageBucket: "jaddy-estudio.firebasestorage.app",
            messagingSenderId: "968903268866",
            appId: "1:968903268866:web:e2b6895e8acff18178e51b",
            measurementId: "G-SBBXXDD3TV"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        let beats = [];
        let currentTab = 'marketplace'; // Pestaña inicial por defecto

        signInAnonymously(auth).then(async () => {
            onSnapshot(collection(db, 'beats'), (snap) => {
                beats = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                render();
            });
            await loadArtists();
        });

        async function loadArtists() {
            const snap = await getDocs(collection(db, 'artistasVIP'));
            const select = document.getElementById('assignedTo');
            select.innerHTML = '<option value="">Seleccionar Artista</option>';
            snap.forEach(d => {
                const a = d.data();
                if(a.status !== 'archived') {
                    select.innerHTML += `<option value="${a.artistName}">${a.artistName}</option>`;
                }
            });
        }

        window.switchTab = (tab) => {
            currentTab = tab;
            const btnMarket = document.getElementById('tabMarketplace');
            const btnVip = document.getElementById('tabVip');

            if (tab === 'marketplace') {
                btnMarket.className = "flex items-center gap-2 px-4 py-2.5 rounded-xl font-black text-xs uppercase tracking-wider transition-all bg-orange-600 text-white shadow-lg shadow-orange-900/20";
                btnVip.className = "flex items-center gap-2 px-4 py-2.5 rounded-xl font-black text-xs uppercase tracking-wider transition-all bg-white/5 text-neutral-400 hover:text-white border border-white/5";
            } else {
                btnVip.className = "flex items-center gap-2 px-4 py-2.5 rounded-xl font-black text-xs uppercase tracking-wider transition-all bg-orange-600 text-white shadow-lg shadow-orange-900/20";
                btnMarket.className = "flex items-center gap-2 px-4 py-2.5 rounded-xl font-black text-xs uppercase tracking-wider transition-all bg-white/5 text-neutral-400 hover:text-white border border-white/5";
            }
            render();
        };

        window.toggleForm = () => {
            document.getElementById('beatForm').classList.toggle('hidden');
            document.getElementById('beatForm').classList.toggle('active');
        };

        window.togglePortalFields = () => {
            const portal = document.getElementById('targetPortal').value;
            document.getElementById('artistContainer').classList.toggle('hidden', portal !== 'vip');
        };

        window.prepareCreate = () => {
            document.getElementById('uploadForm').reset();
            document.getElementById('editingId').value = '';
            document.getElementById('formTitle').innerHTML = '<i data-lucide="plus" class="text-orange-500 w-4 h-4"></i> Nuevo Beat';
            document.getElementById('submitBtnText').innerText = 'PUBLICAR BEAT';
            window.toggleForm();
            window.toggleCreditFields();
            window.togglePortalFields();
            lucide.createIcons();
        };

        window.toggleCreditFields = () => {
            const saleType = document.getElementById('saleType').value;
            const config = document.getElementById('creditConfig');
            config.style.opacity = (saleType === 'contado') ? '0.3' : '1';
            config.style.pointerEvents = (saleType === 'contado') ? 'none' : 'auto';
        };

        function renderBeatCard(b) {
            return `
                <div class="bg-[#0a0a0a] border border-white/5 p-4 rounded-2xl flex flex-col md:flex-row items-center gap-4 hover:border-orange-500/20 transition-all ${!b.visible ? 'opacity-40' : ''}">
                    <div class="flex items-center gap-4 w-full md:w-auto flex-1">
                        <div class="w-10 h-10 bg-white/5 rounded-lg flex items-center justify-center text-orange-500 shrink-0">
                            <i data-lucide="${b.targetPortal === 'vip' ? 'star' : 'music'}" class="w-5 h-5"></i>
                        </div>
                        <div class="min-w-0 flex-1">
                            <div class="flex items-center gap-2">
                                <h3 class="text-xs font-black uppercase text-white truncate">${b.title}</h3>
                                ${b.assignedTo ? `<span class="text-[7px] bg-purple-500/20 text-purple-400 px-1.5 py-0.5 rounded font-bold uppercase">A: ${b.assignedTo}</span>` : ''}
                            </div>
                            <p class="text-[10px] text-neutral-400 truncate">${b.genre || 'Sin género'} • $${b.price || 0}</p>
                        </div>
                    </div>

                    ${b.url ? `
                        <div class="w-full md:w-64 shrink-0">
                            <audio controls class="w-full h-8 accent-orange-500">
                                <source src="${b.url}" type="audio/mpeg">
                                Tu navegador no soporta audio.
                            </audio>
                        </div>
                    ` : '<span class="text-[9px] text-red-500 font-bold uppercase">Sin enlace</span>'}

                    <div class="flex gap-2 w-full md:w-auto justify-end">
                        <button onclick="window.prepareEdit('${b.id}')" class="p-2 bg-white/5 text-neutral-400 hover:text-white rounded-lg transition-all"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
                        <button onclick="window.deleteBeat('${b.id}')" class="p-2 bg-red-500/10 text-red-400 hover:bg-red-500/20 rounded-lg transition-all"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </div>
                </div>
            `;
        }

        function render() {
            const marketplaceBeats = beats.filter(b => b.targetPortal !== 'vip');
            const vipBeats = beats.filter(b => b.targetPortal === 'vip');

            document.getElementById('counterMarketplace').innerText = marketplaceBeats.length;
            document.getElementById('counterVip').innerText = vipBeats.length;

            const container = document.getElementById('activeTabContainer');
            const activeBeats = currentTab === 'marketplace' ? marketplaceBeats : vipBeats;

            if (activeBeats.length === 0) {
                container.innerHTML = `<div class="p-8 bg-white/5 border border-white/5 rounded-2xl text-center text-xs text-neutral-500 uppercase font-bold">No hay pistas registradas en esta sección</div>`;
            } else {
                container.innerHTML = activeBeats.map(renderBeatCard).join('');
            }

            lucide.createIcons();
        }

        window.prepareEdit = (id) => {
            const b = beats.find(x => x.id === id);
            if(!b) return;
            document.getElementById('editingId').value = b.id;
            document.getElementById('title').value = b.title || '';
            document.getElementById('producer').value = b.producer || '';
            document.getElementById('category').value = b.category || 'licencia';
            document.getElementById('targetPortal').value = b.targetPortal || 'marketplace';
            document.getElementById('assignedTo').value = b.assignedTo || '';
            document.getElementById('url').value = b.url || '';
            document.getElementById('genre').value = b.genre || '';
            document.getElementById('whatsapp').value = b.whatsapp || '';
            document.getElementById('description').value = b.description || '';
            document.getElementById('saleType').value = b.saleType || 'contado';
            document.getElementById('price').value = b.price || '';
            document.getElementById('isVisible').checked = b.visible !== false;
            
            document.getElementById('formTitle').innerHTML = `Editando: ${b.title}`;
            document.getElementById('submitBtnText').innerText = 'ACTUALIZAR BEAT';
            if(!document.getElementById('beatForm').classList.contains('active')) window.toggleForm();
            window.togglePortalFields();
            window.toggleCreditFields();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.deleteBeat = async (id) => {
            if(confirm('¿Seguro que deseas eliminar este beat?')) {
                await deleteDoc(doc(db, 'beats', id));
            }
        };

        document.getElementById('uploadForm').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('editingId').value;
            const data = {
                title: document.getElementById('title').value,
                producer: document.getElementById('producer').value,
                category: document.getElementById('category').value,
                targetPortal: document.getElementById('targetPortal').value,
                assignedTo: document.getElementById('targetPortal').value === 'vip' ? document.getElementById('assignedTo').value : '',
                url: document.getElementById('url').value,
                genre: document.getElementById('genre').value,
                whatsapp: document.getElementById('whatsapp').value,
                description: document.getElementById('description').value,
                saleType: document.getElementById('saleType').value,
                price: parseFloat(document.getElementById('price').value) || 0,
                visible: document.getElementById('isVisible').checked,
                updatedAt: serverTimestamp()
            };
            
            if(id) {
                await updateDoc(doc(db, 'beats', id), data);
            } else {
                await addDoc(collection(db, 'beats'), { ...data, createdAt: serverTimestamp() });
            }
            window.toggleForm();
        };
    </script>
</body>
</html>
